services:
  db:
    image: postgres:16-alpine
    container_name: closet-db
    environment:
      POSTGRES_USER: closet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-closet_dev_password}
      POSTGRES_DB: closet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: closet-api
    environment:
      DATABASE_URL: postgresql://closet:${DB_PASSWORD:-closet_dev_password}@db:5432/closet
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod-32c}
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      IMAGE_STORAGE_PATH: /data/images
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8083}
    volumes:
      - images:/data/images
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    container_name: closet-web
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3001
      EXPO_DEVTOOLS_LISTEN_ADDRESS: "0.0.0.0"
    ports:
      - "8083:8083"
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  images:
