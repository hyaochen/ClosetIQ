services:
  db:
    image: postgres:16-alpine
    container_name: closet-db
    mem_limit: 512m
    environment:
      POSTGRES_USER: closet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-closet_dev_password}
      POSTGRES_DB: closet
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U closet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: closet-api
    mem_limit: 512m
    environment:
      DATABASE_URL: postgresql://closet:${DB_PASSWORD:-closet_dev_password}@db:5432/closet
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-prod-32c}
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      IMAGE_STORAGE_PATH: /data/images
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8083}
      # ---- P2 ----
      REMBG_URL: http://rembg:7000
      REMBG_MODEL: ${REMBG_MODEL:-isnet-general-use}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      # ---- T-CL-017 ---- bridge = the account holder's Claude subscription through the host
      # claude-bridge (tools/claude-bridge, listens on host 127.0.0.1:8765 only). Non-secret defaults:
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:8765}
    # Reaches the host from the container (Docker Desktop also resolves it natively; this makes Linux hosts work too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ---- P2 / T-CL-017 ---- Secrets live only in ./.env.ai (gitignored): ANTHROPIC_API_KEY,
    # CLAUDE_BRIDGE_TOKEN (written by tools/claude-bridge/setup-token.mjs) and
    # AI_ALLOWED_USER_IDS (comma separated ClosetIQ user ids allowed to use the subscription bridge;
    # empty = nobody). Without any of them /api/items/analyze is disabled (the add flow hides the AI step).
    env_file:
      - path: ./.env.ai
        required: false
    volumes:
      - images:/data/images
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- P2 ---- Background removal sidecar. Compose-internal only (no published port).
  # Not a dependency of api: if it is down, uploads still succeed and cutouts are marked FAILED.
  rembg:
    image: danielgatis/rembg@sha256:98e72b790093dec3b21967e22c8eb75a0a67d458fdba7ef5fcc1900cad76396b
    container_name: closet-rembg
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui"]
    mem_limit: 3g # measured peak 2.0 GB with isnet-general-use (1.6 GB with u2net)
    cpus: 4
    expose:
      - "7000"
    volumes:
      - rembg-models:/root/.u2net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/openapi.json', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        # Baked into the static bundle at build time (EXPO_PUBLIC_*)
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3001}
    container_name: closet-web
    mem_limit: 256m
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      - api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  images:
  rembg-models: # ---- P2 ----
