<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>設計規範</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1917;text-decoration:none}a:hover{color:#A8472A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F0E8; color: #1A1917; font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px">
  <div style="border-bottom: 1px solid #1A1917; padding-bottom: 12px">
    <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53">DESIGN NOTES</div>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <h1 style="margin: 2px 0 0 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 32px">ClosetIQ</h1>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; color: #5E5A53">Editorial</span>
    </div>
  </div>

  <div>
    <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53; margin-bottom: 8px">色彩 · 淺色</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{light}}" as="c" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="height: 40px; background: {{c.hex}}; border: 1px solid #1A1917"></span>
          <span style="font-size: 12px">{{c.name}}</span>
          <span style="font-size: 10px; color: #5E5A53; margin-top: -4px">{{c.hex}}</span>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53; margin: 12px 0 8px 0">色彩 · 深色模式</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{dark}}" as="c" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="height: 28px; background: {{c.hex}}; border: 1px solid #1A1917"></span>
          <span style="font-size: 12px">{{c.name}} <span style="font-size: 10px; color: #5E5A53">{{c.hex}}</span></span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="border-top: 1px solid #1A1917; padding-top: 12px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53">字體</div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 30px">今日穿搭</span>
      <span style="font-size: 11px; color: #5E5A53">Noto Serif TC · 標題</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 26px">No. 01 · 10.21</span>
      <span style="font-size: 11px; color: #5E5A53">Cormorant · 數字</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 14px">內文與按鈕，行高 1.6</span>
      <span style="font-size: 11px; color: #5E5A53">Noto Sans TC · 內文</span>
    </div>
  </div>

  <div style="border-top: 1px solid #1A1917; padding-top: 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53">元件</div>
    <div style="display: flex; gap: 8px">
      <span style="flex: 1 1 0; height: 44px; background: #1A1917; color: #F4F0E8; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 0.08em">主要動作</span>
      <span style="flex: 1 1 0; height: 44px; border: 1px solid #1A1917; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 0.08em">次要動作</span>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center">
      <span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; font-size: 12px; background: #1A1917; color: #F4F0E8; border: 1px solid #1A1917">已選</span>
      <span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; font-size: 12px; border: 1px solid #1A1917">未選</span>
      <span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; font-size: 12px; color: #A8472A; border: 1px dashed #A8472A">AI 待確認</span>
      <span style="font-size: 11px; letter-spacing: 0.1em; padding: 2px 7px; background: #A8472A; color: #FFFFFF">待洗</span>
      <span style="font-size: 11px; letter-spacing: 0.1em; padding: 2px 7px; background: #4F5B3A; color: #FFFFFF">送洗中</span>
      <span style="font-size: 11px; letter-spacing: 0.1em; padding: 1px 6px; border: 1px solid #1A1917">季外</span>
    </div>
    <div style="font-size: 12px; line-height: 1.7; color: #5E5A53">直角，1px 墨色細線分區，不用陰影與漸層。衣物一律去背放在卡色底上，照片是版面主角。狀態同時用顏色與文字標示。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var light = [['紙', '#F4F0E8'], ['卡', '#E9E2D4'], ['墨', '#1A1917'], ['灰字', '#5E5A53'], ['細線', '#CFC7B8'], ['赭紅', '#A8472A']].map(function (c) { return { name: c[0], hex: c[1] }; });
    var dark = [['炭', '#161513'], ['暖白', '#EDE7DC'], ['赭紅亮', '#D0794F']].map(function (c) { return { name: c[0], hex: c[1] }; });
    return { light: light, dark: dark };
  }
}
</script>
</body>
</html>
