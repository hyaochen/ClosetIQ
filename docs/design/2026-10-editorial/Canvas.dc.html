<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>拼貼穿搭畫布</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1917;text-decoration:none}a:hover{color:#A8472A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F0E8; color: #1A1917; font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box">
  <div style="height: 54px; padding: 6px 12px 0 12px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; border-bottom: 1px solid #1A1917">
    <a href="Plan.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 14px">取消</a>
    <div style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px">新穿搭</div>
    <a href="Plan.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 8px; font-size: 14px; font-weight: 700">儲存</a>
  </div>

  <div style="margin: 14px 20px 0 20px; height: 392px; position: relative; overflow: hidden; background: {{bg}}; border: 1px solid #CFC7B8">
    <sc-for list="{{pieces}}" as="p" hint-placeholder-count="5">
      <button onClick="{{p.pick}}" aria-label="{{p.name}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; width: {{p.s}}px; height: {{p.s}}px; transform: rotate({{p.r}}deg); padding: 0; background: transparent; border: {{p.border}}; cursor: pointer">
        <svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true"><path d="{{p.d}}" fill="{{p.fill}}" stroke="#1A1917" stroke-width="1.1" stroke-linejoin="round"></path></svg>
        <sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; left: -5px; top: -5px; width: 8px; height: 8px; background: #F4F0E8; border: 1px solid #1A1917"></span>
          <span style="position: absolute; right: -5px; top: -5px; width: 8px; height: 8px; background: #F4F0E8; border: 1px solid #1A1917"></span>
          <span style="position: absolute; left: -5px; bottom: -5px; width: 8px; height: 8px; background: #F4F0E8; border: 1px solid #1A1917"></span>
          <span style="position: absolute; right: -5px; bottom: -5px; width: 8px; height: 8px; background: #1A1917; border: 1px solid #1A1917"></span>
        </sc-if>
      </button>
    </sc-for>
    <span style="position: absolute; right: 10px; bottom: 8px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: #5E5A53">Look No. 25</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 10px 20px 0 20px; border-top: 1px solid #1A1917; border-bottom: 1px solid #1A1917">
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="4">
      <button style="height: 52px; border: 0; border-left: {{t.bl}}; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'Noto Sans TC', sans-serif; font-size: 11px; color: #1A1917; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 0 20px">
    <div style="display: flex; gap: 16px; font-size: 12px">
      <span style="font-weight: 700; text-decoration: underline; text-underline-offset: 5px">全部</span>
      <span style="color: #5E5A53">上衣</span><span style="color: #5E5A53">下身</span><span style="color: #5E5A53">外套</span><span style="color: #5E5A53">鞋</span><span style="color: #5E5A53">包</span>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 10px">
      <sc-for list="{{tray}}" as="t" hint-placeholder-count="5">
        <span style="width: 62px; height: 62px; flex: none; background: #E9E2D4; display: flex; align-items: center; justify-content: center; position: relative">
          <svg viewBox="0 0 100 100" width="48" height="48" aria-hidden="true"><path d="{{t.d}}" fill="{{t.fill}}" stroke="#1A1917" stroke-width="1.6" stroke-linejoin="round"></path></svg>
          <sc-if value="{{t.used}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; right: 3px; top: 3px; width: 7px; height: 7px; background: #1A1917"></span></sc-if>
        </span>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 22px 20px; border-top: 1px solid #1A1917; display: flex; justify-content: space-between; align-items: center; background: #F4F0E8">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="font-size: 11px; letter-spacing: 0.1em; color: #5E5A53">背景</span>
      <sc-for list="{{bgs}}" as="b" hint-placeholder-count="3">
        <button onClick="{{b.pick}}" aria-label="{{b.name}}" aria-pressed="{{b.on}}" style="width: 30px; height: 30px; padding: 0; background: {{b.hex}}; border: {{b.border}}; cursor: pointer"></button>
      </sc-for>
    </div>
    <a href="#" style="height: 44px; padding: 0 18px; border: 1px solid #1A1917; display: flex; align-items: center; gap: 6px; font-size: 13px; letter-spacing: 0.06em">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.5" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>匯出圖片</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'jacket', bg: 'card' };
  }
  renderVals() {
    var self = this;
    var G = {
      jacket: 'M30 10 L44 6 L50 22 L56 6 L70 10 L86 30 L84 88 L72 88 L70 46 L70 94 L30 94 L30 46 L28 88 L16 88 L14 30 Z M50 22 L50 94',
      tee: 'M30 12 L42 8 Q50 16 58 8 L70 12 L88 28 L78 40 L70 34 L70 90 L30 90 L30 34 L22 40 L12 28 Z',
      pants: 'M30 6 L70 6 L74 94 L56 94 L50 34 L44 94 L26 94 Z',
      shoe: 'M8 64 L12 42 L32 44 L46 56 L82 60 Q93 62 93 72 L93 78 L8 78 Z',
      bag: 'M18 40 L82 40 L86 90 L14 90 Z M36 40 L36 30 Q36 18 50 18 Q64 18 64 30 L64 40 L60 40 L60 30 Q60 22 50 22 Q40 22 40 30 L40 40 Z',
      shorts: 'M24 22 L76 22 L82 72 L56 74 L50 48 L44 74 L18 72 Z'
    };
    var raw = [
      ['pants', '深藍直筒褲', G.pants, '#2F3B52', 150, 140, 200, 2],
      ['tee', '白色 T 恤', G.tee, '#FBFAF7', 150, 14, 160, -3],
      ['jacket', '駝色短版風衣', G.jacket, '#B08A5E', 12, 40, 170, -7],
      ['shoe', '白色皮革球鞋', G.shoe, '#FBFAF7', 22, 248, 120, 4],
      ['bag', '黑色帆布托特', G.bag, '#23211F', 236, 6, 100, 8]
    ];
    var pieces = raw.map(function (r) {
      var on = self.state.sel === r[0];
      return { name: r[1], d: r[2], fill: r[3], x: r[4], y: r[5], s: r[6], r: r[7], on: on, border: on ? '1px dashed #1A1917' : '1px solid transparent', pick: function () { self.setState({ sel: r[0] }); } };
    });
    var tools = [['置前', 'M8 8h12v12H8zM4 16V4h12'], ['置後', 'M4 4h12v12H4zM8 20h12V8'], ['翻轉', 'M12 3v18M8 7L3 12l5 5M16 7l5 5-5 5'], ['移除', 'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13']].map(function (t, i) {
      return { label: t[0], icon: t[1], bl: i === 0 ? '0' : '1px solid #CFC7B8' };
    });
    var tray = [[G.tee, '#FBFAF7', true], [G.jacket, '#B08A5E', true], [G.pants, '#2F3B52', true], [G.shorts, '#6B6B4A', false], [G.shoe, '#FBFAF7', true]].map(function (t) {
      return { d: t[0], fill: t[1], used: t[2] };
    });
    var hexes = { card: '#E9E2D4', white: '#FFFFFF', clay: '#D9C3B0' };
    var bgs = [['card', '卡色'], ['white', '白色'], ['clay', '淺赭']].map(function (b) {
      var on = self.state.bg === b[0];
      return { name: b[1], hex: hexes[b[0]], on: on, border: on ? '2px solid #1A1917' : '1px solid #CFC7B8', pick: function () { self.setState({ bg: b[0] }); } };
    });
    return { pieces: pieces, tools: tools, tray: tray, bgs: bgs, bg: hexes[this.state.bg] };
  }
}
</script>
</body>
</html>
