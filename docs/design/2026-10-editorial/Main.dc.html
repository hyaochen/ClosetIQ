<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>今日</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1917;text-decoration:none}a:hover{color:#A8472A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F0E8; color: #1A1917; font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box">
  <div style="padding: 22px 20px 0 20px; display: flex; flex-direction: column; gap: 0">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid #1A1917">
      <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; font-weight: 600">10.21 Wed.</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5E5A53">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5A53" stroke-width="1.5" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6.1 11.2 3.5 3.5 0 0 0 7 18z"></path></svg>
        <span>台北 24° 多雲</span>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 18px">
      <div>
        <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53">TODAY'S EDIT</div>
        <h1 style="margin: 4px 0 0 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 40px; line-height: 1.1; letter-spacing: 0.04em">今日穿搭</h1>
      </div>
      <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px; color: #5E5A53; padding-bottom: 6px">No. 01 / 06</div>
    </div>

    <div style="margin-top: 14px; height: 262px; background: #E9E2D4; position: relative; overflow: hidden">
      <sc-for list="{{look}}" as="g" hint-placeholder-count="4">
        <svg viewBox="0 0 100 100" aria-hidden="true" style="position: absolute; left: {{g.x}}px; top: {{g.y}}px; width: {{g.s}}px; height: {{g.s}}px; transform: rotate({{g.r}}deg)"><path d="{{g.d}}" fill="{{g.fill}}" stroke="#1A1917" stroke-width="1.1" stroke-linejoin="round"></path></svg>
      </sc-for>
      <div style="position: absolute; left: 12px; bottom: 10px; font-size: 11px; letter-spacing: 0.16em; background: #F4F0E8; padding: 4px 8px">通勤・微涼</div>
    </div>

    <div style="margin-top: 12px; font-size: 13px; line-height: 1.6; color: #1A1917">白襯衫 · 深藍直筒褲 · 駝色風衣 · 白球鞋</div>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E5A53">
      <span style="width: 6px; height: 6px; background: #A8472A; display: inline-block"></span>
      <span>晚間降到 19°，風衣建議帶著</span>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 14px">
      <a href="Journal.dc.html" style="flex: 1 1 0; height: 48px; background: #1A1917; color: #F4F0E8; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; letter-spacing: 0.08em">就穿這套</a>
      <a href="#" style="flex: 1 1 0; height: 48px; border: 1px solid #1A1917; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; letter-spacing: 0.08em">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.5" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"></path></svg>換一套</a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-top: 22px; padding-bottom: 8px; border-bottom: 1px solid #1A1917">
      <div style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px">本週計畫</div>
      <a href="Plan.dc.html" style="font-size: 12px; letter-spacing: 0.1em; color: #5E5A53">查看全部</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 10px">
      <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; background: {{d.bg}}; color: {{d.fg}}">
          <span style="font-size: 11px">{{d.w}}</span>
          <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 20px; font-weight: 600; line-height: 1.1">{{d.n}}</span>
          <span style="font-size: 10px">{{d.t}}</span>
          <span style="width: 5px; height: 5px; background: {{d.dot}}"></span>
        </div>
      </sc-for>
    </div>

    <a href="Me.dc.html" style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 10px 0; border-top: 1px solid #CFC7B8; border-bottom: 1px solid #CFC7B8; font-size: 13px">
      <span><span style="color: #A8472A; font-weight: 700">待洗 6 件</span><span style="color: #5E5A53"> · 白襯衫只剩今天這件乾淨</span></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.5" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #F4F0E8; border-top: 1px solid #1A1917; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); box-sizing: border-box; padding-bottom: 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-label="{{t.label}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; letter-spacing: 0.1em; color: {{t.fg}}; border-top: {{t.bar}}; margin-top: -1px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var G = {
      jacket: 'M30 10 L44 6 L50 22 L56 6 L70 10 L86 30 L84 88 L72 88 L70 46 L70 94 L30 94 L30 46 L28 88 L16 88 L14 30 Z M50 22 L50 94',
      shirt: 'M32 10 L44 6 L50 16 L56 6 L68 10 L84 26 L90 72 L80 74 L72 38 L72 92 L28 92 L28 38 L20 74 L10 72 L16 26 Z M50 16 L50 92',
      pants: 'M30 6 L70 6 L74 94 L56 94 L50 34 L44 94 L26 94 Z',
      shoe: 'M8 64 L12 42 L32 44 L46 56 L82 60 Q93 62 93 72 L93 78 L8 78 Z'
    };
    var look = [
      { d: G.pants, fill: '#2F3B52', x: 150, y: 70, s: 190, r: 3 },
      { d: G.shirt, fill: '#FBFAF7', x: 132, y: 6, s: 150, r: -2 },
      { d: G.jacket, fill: '#B08A5E', x: 6, y: 18, s: 170, r: -6 },
      { d: G.shoe, fill: '#FBFAF7', x: 24, y: 170, s: 110, r: 0 }
    ];
    var days = [['三','21','24°'],['四','22','26°'],['五','23','25°'],['六','24','23°'],['日','25','18°'],['一','26','17°'],['二','27','19°']];
    var planned = [true, true, false, true, true, true, false];
    var week = days.map(function (d, i) {
      var today = i === 0;
      return { w: d[0], n: d[1], t: d[2], bg: today ? '#1A1917' : 'transparent', fg: today ? '#F4F0E8' : '#1A1917', dot: planned[i] ? (today ? '#F4F0E8' : '#A8472A') : 'transparent' };
    });
    var icons = {
      today: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z',
      closet: 'M12 7a2 2 0 1 1 2-2c0 1.2-2 1.6-2 3L3 15c-.8.6-.4 2 .6 2h16.8c1 0 1.4-1.4.6-2L12 8',
      outfit: 'M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5',
      journal: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6',
      me: 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1.2-4 4.4-6 8-6s6.8 2 8 6'
    };
    var active = 'today';
    var tabs = [['today','今日','Main.dc.html'],['closet','衣櫃','Wardrobe.dc.html'],['outfit','穿搭','Plan.dc.html'],['journal','日記','Journal.dc.html'],['me','我的','Me.dc.html']].map(function (t) {
      var on = t[0] === active;
      return { label: t[1], href: t[2], icon: icons[t[0]], fg: on ? '#1A1917' : '#5E5A53', bar: on ? '2px solid #1A1917' : '2px solid transparent' };
    });
    return { look: look, week: week, tabs: tabs };
  }
}
</script>
</body>
</html>
