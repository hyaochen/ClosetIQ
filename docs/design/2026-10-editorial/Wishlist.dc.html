<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>願望清單與購前分析</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1917;text-decoration:none}a:hover{color:#A8472A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F0E8; color: #1A1917; font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box">
  <div style="padding: 22px 20px 0 20px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: baseline; gap: 10px">
      <h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 34px; letter-spacing: 0.04em">衣櫃</h1>
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 18px; color: #5E5A53">wishlist</span>
    </div>
    <div style="display: flex; gap: 24px; margin-top: 8px; border-bottom: 1px solid #1A1917">
      <a href="Wardrobe.dc.html" style="padding: 8px 0; font-size: 14px; color: #5E5A53">我的衣物</a>
      <a href="Wishlist.dc.html" style="padding: 8px 0; font-size: 14px; font-weight: 700; border-bottom: 2px solid #1A1917; margin-bottom: -1px">願望清單 <span style="font-family: 'Cormorant Garamond', serif; font-style: italic">4</span></a>
    </div>

    <div style="display: flex; gap: 14px; margin-top: 16px">
      <div style="width: 116px; height: 136px; flex: none; background: #E9E2D4; display: flex; align-items: center; justify-content: center">
        <svg viewBox="0 0 100 100" width="96" height="96" aria-hidden="true"><path d="M32 10 L44 6 L50 16 L56 6 L68 10 L84 26 L90 72 L80 74 L72 38 L72 92 L28 92 L28 38 L20 74 L10 72 L16 26 Z M50 16 L50 92 M34 34 L46 34 L46 46 L34 46 Z M54 34 L66 34 L66 46 L54 46 Z" fill="#6B6B4A" stroke="#1A1917" stroke-width="1.3" stroke-linejoin="round"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <div style="font-size: 11px; letter-spacing: 0.18em; color: #5E5A53">上衣 · 想買</div>
        <div style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 19px; line-height: 1.3; margin-top: 2px">橄欖綠工裝襯衫</div>
        <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 22px; margin-top: 2px">NT$1,680</div>
        <div style="font-size: 12px; color: #5E5A53; margin-top: auto">10.18 加入 · 附商品連結</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-end; gap: 10px; margin-top: 16px; border-top: 1px solid #1A1917; padding-top: 10px">
      <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 56px; line-height: 0.9">23</span>
      <span style="font-size: 13px; padding-bottom: 4px">件現有衣物能和它搭配</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px">
      <sc-for list="{{fit}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px">
          <span style="width: 34px; color: #5E5A53">{{f.k}}</span>
          <span style="flex: 1 1 auto; height: 8px; background: #E9E2D4"><span style="display: block; height: 8px; width: {{f.pct}}; background: #1A1917"></span></span>
          <span style="width: 36px; text-align: right">{{f.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 14px; padding: 10px 12px; border: 1px solid #A8472A; display: flex; gap: 10px; align-items: center">
      <div style="display: flex; gap: 4px; flex: none">
        <span style="width: 34px; height: 38px; background: #E9E2D4; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true"><path d="M32 10 L44 6 L50 16 L56 6 L68 10 L84 26 L90 72 L80 74 L72 38 L72 92 L28 92 L28 38 L20 74 L10 72 L16 26 Z" fill="#4F5B3A" stroke="#1A1917" stroke-width="3"></path></svg></span>
        <span style="width: 34px; height: 38px; background: #E9E2D4; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 100 100" width="28" height="28" aria-hidden="true"><path d="M32 10 L44 6 L50 16 L56 6 L68 10 L84 26 L90 72 L80 74 L72 38 L72 92 L28 92 L28 38 L20 74 L10 72 L16 26 Z" fill="#7A7C55" stroke="#1A1917" stroke-width="3"></path></svg></span>
      </div>
      <div style="font-size: 12px; line-height: 1.5"><span style="color: #A8472A; font-weight: 700">相似單品 2 件</span>：你已有兩件綠色系襯衫，近 90 天各只穿過 1 次。</div>
    </div>

    <div style="display: flex; gap: 10px; margin-top: 14px">
      <a href="#" style="flex: 1 1 0; height: 46px; border: 1px solid #1A1917; display: flex; align-items: center; justify-content: center; font-size: 13px">不買了</a>
      <a href="AddItem.dc.html" style="flex: 1.4 1 0; height: 46px; background: #1A1917; color: #F4F0E8; display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: 0.06em">買了，移進衣櫃</a>
    </div>

    <div style="margin-top: 18px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #1A1917; padding-bottom: 6px">
      <span style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px">衣櫃缺口</span>
      <span style="font-size: 11px; color: #5E5A53">依場合與季節計算</span>
    </div>
    <sc-for list="{{gaps}}" as="g" hint-placeholder-count="2">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 40px; border-bottom: 1px solid #CFC7B8; font-size: 13px">
        <span>{{g.k}}</span><span style="color: #A8472A">{{g.v}}</span>
      </div>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #F4F0E8; border-top: 1px solid #1A1917; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); box-sizing: border-box; padding-bottom: 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-label="{{t.label}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; letter-spacing: 0.1em; color: {{t.fg}}; border-top: {{t.bar}}; margin-top: -1px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var fit = [['下身', 9, 14], ['外套', 8, 11], ['鞋', 6, 9]].map(function (f) {
      return { k: f[0], v: f[1] + ' / ' + f[2], pct: Math.round(f[1] / f[2] * 100) + '%' };
    });
    var gaps = [{ k: '正式場合的鞋', v: '0 雙' }, { k: '冬季外套', v: '只有 1 件' }];
    var icons = {
      today: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z',
      closet: 'M12 7a2 2 0 1 1 2-2c0 1.2-2 1.6-2 3L3 15c-.8.6-.4 2 .6 2h16.8c1 0 1.4-1.4.6-2L12 8',
      outfit: 'M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5',
      journal: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6',
      me: 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1.2-4 4.4-6 8-6s6.8 2 8 6'
    };
    var tabs = [['today','今日','Main.dc.html'],['closet','衣櫃','Wardrobe.dc.html'],['outfit','穿搭','Plan.dc.html'],['journal','日記','Journal.dc.html'],['me','我的','Me.dc.html']].map(function (t) {
      var on = t[0] === 'closet';
      return { label: t[1], href: t[2], icon: icons[t[0]], fg: on ? '#1A1917' : '#5E5A53', bar: on ? '2px solid #1A1917' : '2px solid transparent' };
    });
    return { fit: fit, gaps: gaps, tabs: tabs };
  }
}
</script>
</body>
</html>
