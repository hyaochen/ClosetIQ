<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>OOTD 日記</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1917;text-decoration:none}a:hover{color:#A8472A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F0E8; color: #1A1917; font-family: 'Noto Sans TC', sans-serif; box-sizing: border-box">
  <div style="padding: 22px 20px 0 20px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 34px; letter-spacing: 0.04em">日記</h1>
      <a href="#" style="height: 40px; padding: 0 14px; background: #1A1917; color: #F4F0E8; display: flex; align-items: center; gap: 6px; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4F0E8" stroke-width="1.5" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 10a3 3 0 1 0 0 6a3 3 0 1 0 0-6z"></path></svg>拍今日穿搭</a>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-bottom: 6px; border-bottom: 1px solid #1A1917">
      <button aria-label="上個月" style="width: 44px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-start; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.5" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px">October</span>
        <span style="font-size: 13px; color: #5E5A53">2026 · 十月</span>
      </div>
      <button aria-label="下個月" style="width: 44px; height: 40px; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-end; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1917" stroke-width="1.5" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; font-size: 11px; color: #5E5A53; text-align: center">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 6px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <div style="height: 58px; position: relative; background: {{c.bg}}; border: {{c.bd}}; box-sizing: border-box; overflow: hidden">
          <sc-if value="{{c.photo}}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 40 56" width="100%" height="100%" aria-hidden="true" preserveAspectRatio="xMidYMax meet"><path d="M20 3a5 5 0 1 0 0.01 0z" fill="#8C7A68"></path><path d="M12 15 L28 15 L30 31 L10 31 Z" fill="{{c.top}}" stroke="#1A1917" stroke-width="0.6"></path><path d="M12 31 L28 31 L26 54 L21 54 L20 38 L19 54 L14 54 Z" fill="{{c.bot}}" stroke="#1A1917" stroke-width="0.6"></path></svg>
          </sc-if>
          <span style="position: absolute; left: 3px; top: 1px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 13px; color: {{c.fg}}">{{c.n}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #1A1917; padding-bottom: 6px">
      <span style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px">十月回顧</span>
      <span style="font-size: 11px; color: #5E5A53">至 10.21</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid #CFC7B8">
      <sc-for list="{{recap}}" as="r" hint-placeholder-count="3">
        <div style="padding: 8px 0 8px 10px; border-left: {{r.bl}}">
          <div style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 28px; line-height: 1.05">{{r.v}}</div>
          <div style="font-size: 11px; color: #5E5A53">{{r.k}}</div>
        </div>
      </sc-for>
    </div>
    <div style="font-size: 13px; padding: 10px 0; border-bottom: 1px solid #CFC7B8; display: flex; justify-content: space-between">
      <span style="color: #5E5A53">最常一起穿</span><span>白色 T 恤 + 深藍直筒褲 · 5 次</span>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: #F4F0E8; border-top: 1px solid #1A1917; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); box-sizing: border-box; padding-bottom: 14px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" aria-label="{{t.label}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; letter-spacing: 0.1em; color: {{t.fg}}; border-top: {{t.bar}}; margin-top: -1px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var logged = { 1: 1, 2: 2, 3: 0, 5: 3, 6: 1, 7: 2, 8: 4, 9: 0, 12: 1, 13: 3, 14: 2, 15: 1, 16: 4, 18: 0, 19: 3, 20: 1, 21: 2 };
    var outfits = [['#FBFAF7', '#2F3B52'], ['#23211F', '#B08A5E'], ['#B9C8D8', '#23211F'], ['#4F5B3A', '#4F5B3A'], ['#FBFAF7', '#5A7290']];
    var tiles = ['#E3D9C9', '#D9CFC0', '#E9E2D4', '#DDD3C3', '#E6DDCE'];
    var cells = [];
    for (var b = 0; b < 3; b++) cells.push({ n: '', bg: 'transparent', bd: '0', photo: false, top: '', bot: '', fg: '#1A1917' });
    for (var d = 1; d <= 31; d++) {
      var has = logged[d] !== undefined;
      var o = has ? outfits[logged[d]] : ['', ''];
      var today = d === 21;
      var future = d > 21;
      cells.push({ n: String(d), bg: has ? tiles[d % 5] : 'transparent', bd: today ? '2px solid #A8472A' : (future ? '1px solid #E0D8CA' : '1px solid #CFC7B8'), photo: has, top: o[0], bot: o[1], fg: today ? '#A8472A' : (future ? '#8A857D' : '#1A1917') });
    }
    cells.push({ n: '', bg: 'transparent', bd: '0', photo: false, top: '', bot: '', fg: '#1A1917' });
    var recap = [['17', '天有紀錄'], ['34%', '衣櫃使用率'], ['×6', '白色 T 恤']].map(function (r, i) {
      return { v: r[0], k: r[1], bl: i === 0 ? '0' : '1px solid #CFC7B8' };
    });
    var icons = {
      today: 'M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z',
      closet: 'M12 7a2 2 0 1 1 2-2c0 1.2-2 1.6-2 3L3 15c-.8.6-.4 2 .6 2h16.8c1 0 1.4-1.4.6-2L12 8',
      outfit: 'M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5',
      journal: 'M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11M9 8h6',
      me: 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8zM4 21c1.2-4 4.4-6 8-6s6.8 2 8 6'
    };
    var tabs = [['today','今日','Main.dc.html'],['closet','衣櫃','Wardrobe.dc.html'],['outfit','穿搭','Plan.dc.html'],['journal','日記','Journal.dc.html'],['me','我的','Me.dc.html']].map(function (t) {
      var on = t[0] === 'journal';
      return { label: t[1], href: t[2], icon: icons[t[0]], fg: on ? '#1A1917' : '#5E5A53', bar: on ? '2px solid #1A1917' : '2px solid transparent' };
    });
    return { cells: cells, recap: recap, tabs: tabs };
  }
}
</script>
</body>
</html>
