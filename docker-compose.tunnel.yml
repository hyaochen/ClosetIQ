services:
  web:
    environment:
      EXPO_PUBLIC_API_URL: ${TUNNEL_API_URL:-https://your-api.example.com}

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: closet-tunnel
    command: tunnel --config /etc/cloudflared/closet-docker-config.yml run
    volumes:
      - ${CLOUDFLARED_CONFIG_DIR:-~/.cloudflared}:/etc/cloudflared:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
